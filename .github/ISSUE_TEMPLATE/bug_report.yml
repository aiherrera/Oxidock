name: Bug report
description: Report incorrect behavior in Oxidock
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. See error"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Oxidock version or commit
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
  - type: input
    id: docker
    attributes:
      label: Docker provider / version
      placeholder: e.g. Docker Desktop 4.x, Colima, OrbStack
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant terminal output or attach screenshots.
