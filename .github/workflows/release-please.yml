name: Release Please

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Create or update Release Please PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find open Release Please PR
        id: release_pr
        if: steps.release.outputs.releases_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label "autorelease: pending" \
            --json number,headRefName \
            --limit 1)"

          HEAD_REF="$(node -e "const prs = JSON.parse(process.argv[1]); process.stdout.write(prs[0]?.headRefName ?? '')" "$PR_JSON")"
          NUMBER="$(node -e "const prs = JSON.parse(process.argv[1]); process.stdout.write(String(prs[0]?.number ?? ''))" "$PR_JSON")"

          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Check out Release Please branch
        if: steps.release.outputs.releases_created != 'true' && steps.release_pr.outputs.head_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_pr.outputs.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main into Release Please branch
        if: steps.release.outputs.releases_created != 'true' && steps.release_pr.outputs.head_ref != ''
        run: |
          git fetch origin main
          git merge origin/main --no-edit

      - name: Set up pnpm
        if: steps.release.outputs.releases_created != 'true' && steps.release_pr.outputs.head_ref != ''
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Set up Node.js
        if: steps.release.outputs.releases_created != 'true' && steps.release_pr.outputs.head_ref != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.release.outputs.releases_created != 'true' && steps.release_pr.outputs.head_ref != ''
        run: pnpm install --frozen-lockfile

      - name: Format generated release files
        if: steps.release.outputs.releases_created != 'true' && steps.release_pr.outputs.head_ref != ''
        run: |
          pnpm exec prettier \
            package.json \
            .release-please-manifest.json \
            src-tauri/tauri.conf.json \
            --write
          pnpm format:check

      - name: Push formatting fixes to Release Please PR
        if: steps.release.outputs.releases_created != 'true' && steps.release_pr.outputs.head_ref != ''
        run: |
          if git diff --quiet; then
            echo "Release Please PR files already satisfy formatting checks."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .release-please-manifest.json src-tauri/tauri.conf.json
          git commit -m "chore: format generated release files"
          git push origin "HEAD:${{ steps.release_pr.outputs.head_ref }}"

  signed-macos-release:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve published release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName')"

          if [ -z "$TAG" ]; then
            echo "No GitHub release tag found after Release Please publish." >&2
            exit 1
          fi

          echo "Resolved tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Trigger signed macOS release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f "tag=${{ steps.tag.outputs.tag }}"

          echo "Triggered Release workflow for ${{ steps.tag.outputs.tag }}."
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow release.yml \
            --limit 3
